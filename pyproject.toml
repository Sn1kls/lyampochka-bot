[project]
name = "poweron"
version = "0.1.0"
description = "Power outage schedules for Ternopiloblenergo"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.importlinter]
root_package = "poweron"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core does not depend on adapters"
type = "layers"
layers = ["poweron.adapters", "poweron.core"]

[[tool.importlinter.contracts]]
name = "core uses only stdlib and pydantic"
type = "forbidden"
source_modules = ["poweron.core"]
forbidden_modules = ["httpx", "sqlalchemy", "aiogram", "apscheduler", "poweron.worker"]
