services:
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/poweron.sqlite3
    volumes:
      - data:/data
    restart: unless-stopped
    stop_grace_period: 90s
    # aiogram alone costs ~120 MB at import; the bot idles at ~200 MB, so 256 MB left no room.
    mem_limit: 512m
    logging:
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:
