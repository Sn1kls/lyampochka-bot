name: AI PR review

# Reviews a PR with the pr-review skill (Claude Agent SDK) and posts the result as
# github-actions[bot]: inline comments for critical findings plus one summary comment that
# is updated on every run. Bot threads whose finding is gone are resolved. Advisory only:
# it never approves or requests changes, and lives apart from check.yml so it never turns CI red.
#
# Runs when a PR is opened, reopened or marked ready (not on every push), and on a PR comment
# starting with /ai-review from someone with write access. GitHub reads issue_comment
# workflows from the default branch (develop), so the comment trigger needs this file there.
#
# Repo setup: secret ANTHROPIC_API_KEY; optional variable AI_REVIEW_MODEL.
# Ported from kst-crm's ai-pr-review, reduced to a single reviewer.

on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    branches: [develop, main]
  issue_comment:
    types: [created]

env:
  AI_REVIEW_MODEL: ${{ vars.AI_REVIEW_MODEL || 'claude-sonnet-5-5' }}

jobs:
  # Decides whether to review and which commit. Ordinary PR comments stop at the job-level
  # `if`, before any concurrency group, so chatting on a PR never cancels a running review.
  context:
    if: >-
      github.event_name == 'pull_request'
      || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/ai-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: write
      statuses: write
    outputs:
      run: ${{ steps.pr.outputs.run }}
      number: ${{ steps.pr.outputs.number }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          pr=$(gh api "repos/$REPO/pulls/$NUMBER")
          base_ref=$(jq -r .base.ref <<<"$pr")
          {
            echo "number=$NUMBER"
            echo "head_sha=$(jq -r .head.sha <<<"$pr")"
            echo "base_ref=$base_ref"
          } >> "$GITHUB_OUTPUT"

          skip() { echo "::notice title=AI review skipped::$1"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # The review tooling comes from the base branch, so the PR that adds it cannot review itself.
          gh api "repos/$REPO/contents/.github/scripts/run_ai_review.py?ref=$base_ref" --silent 2>/dev/null \
            || skip "the AI review is not on '$base_ref' yet; reviews start once it is merged there"

          # Fork PRs never get the key: their code and text are fully outside our control.
          [ "$(jq -r .head.repo.full_name <<<"$pr")" = "$REPO" ] || skip "PR comes from a fork"

          if [ "$EVENT" = issue_comment ]; then
            permission=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" -q .permission)
            case "$permission" in
              admin|maintain|write) ;;
              *) skip "$ACTOR has '$permission' access; /ai-review needs write" ;;
            esac
            [ "$(jq -r .state <<<"$pr")" = open ] || skip "PR is closed"
            gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null || true
          else
            [ "$(jq -r .draft <<<"$pr")" = false ] || skip "draft PR"
            [ "$(jq -r .user.type <<<"$pr")" != Bot ] || skip "PR opened by a bot"
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      # A comment-triggered run belongs to the default branch, so the PR shows no check for it; a commit status does.
      - name: Mark the review as running
        if: github.event_name == 'issue_comment' && steps.pr.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state=pending -f context="AI PR review" \
            -f description="Review in progress" -f target_url="$RUN_URL" >/dev/null \
            || echo "::warning::Could not set the commit status"

  review:
    needs: context
    if: needs.context.outputs.run == 'true'
    concurrency:
      group: ai-pr-review-${{ needs.context.outputs.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Holds the LLM key, so it gets no write access to the repo or the PR.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install preflight tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq gawk

      # The agent loads .claude/ and CLAUDE.md with the key in its environment, and the PR head is
      # untrusted, so the tooling, the skill and the rules all come from the base branch. Only the
      # skill is restored: .claude/settings.json allows `uv run pytest`, which would run PR code.
      - name: Load trusted review tooling from the base branch
        env:
          BASE_REF: ${{ needs.context.outputs.base_ref }}
        run: |
          git show "origin/$BASE_REF:.github/scripts/run_ai_review.py" > "$RUNNER_TEMP/run_ai_review.py"
          git show "origin/$BASE_REF:.github/scripts/ai_review_stats.py" > "$RUNNER_TEMP/ai_review_stats.py"
          git show "origin/$BASE_REF:.github/ai-review/report.schema.json" > "$RUNNER_TEMP/report.schema.json"
          find . -path ./.git -prune -o \( -name CLAUDE.md -o -name CLAUDE.local.md -o -name .claude \
            -o -name .mcp.json -o -name .claude.json \) -prune -exec rm -rf {} +
          rm -f report.json run-stats.json claude-execution-output.json
          git archive "origin/$BASE_REF" CLAUDE.md .claude/skills | tar -x

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Review with pr-review through the Agent SDK
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ needs.context.outputs.number }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          PR_BASE_REF: ${{ needs.context.outputs.base_ref }}
        # The SDK itself is pinned, its dependencies are not: this step holds the Anthropic key.
        run: >-
          uv run --no-project --no-config --with claude-agent-sdk==0.2.179
          python "$RUNNER_TEMP/run_ai_review.py" --schema "$RUNNER_TEMP/report.schema.json"

      - name: Measure run cost
        if: always()
        run: python3 "$RUNNER_TEMP/ai_review_stats.py" --transcript claude-execution-output.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-review-report
          path: |
            report.json
            run-stats.json
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [context, review]
    # Runs after a failed review too, so the PR says the review did not complete.
    if: >-
      always()
      && needs.context.outputs.run == 'true'
      && needs.review.result != 'skipped'
      && needs.review.result != 'cancelled'
    concurrency:
      group: ai-pr-publish-${{ needs.context.outputs.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # GitHub refuses resolveReviewThread to GITHUB_TOKEN without contents: write.
      contents: write
      pull-requests: write
      issues: write
    steps:
      # The publisher comes from the base branch, never from the PR it posts on.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.context.outputs.base_ref }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ai-review-report

      - name: Post review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.context.outputs.number }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/post_ai_review.py report.json --stats run-stats.json

  # Separate job so the status leaves "pending" even when review or publish fails, is cancelled or times out.
  status:
    needs: [context, review, publish]
    if: always() && needs.context.outputs.run == 'true' && github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Mark the review as finished
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.context.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_RESULT: ${{ needs.review.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          if [ "$REVIEW_RESULT" = success ] && [ "$PUBLISH_RESULT" = success ]; then
            state=success; text="Review posted"
          elif [ "$REVIEW_RESULT" = cancelled ] || [ "$PUBLISH_RESULT" = cancelled ]; then
            state=error; text="Review cancelled"
          else
            state=failure; text="Review did not complete"
          fi
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" -f state="$state" -f context="AI PR review" \
            -f description="$text" -f target_url="$RUN_URL" >/dev/null \
            || echo "::warning::Could not set the commit status"
